# =====================
# SPRING BOOT GENERAL
# =====================
spring.application.name=control-asistencia

# =====================
# MONGODB (única base de datos: usuarios, roles, asistencias, configuración)
# En la nube: MONGO_URI=mongodb+srv://usuario:clave@cluster0.xxxx.mongodb.net/asistcontrol
# =====================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/asistcontrol}
spring.data.mongodb.auto-index-creation=true

# =====================
# OLLAMA
# =====================
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
# Temperatura 0.0 para máxima precisión técnica (evita alucinaciones)
spring.ai.ollama.chat.options.temperature=0.2
# Tiempo de espera aumentado para que Docker alcance a responder
spring.ai.ollama.chat.options.timeout=90s

app.ai.negacion=Lo siento, no puedo responder esa pregunta.

# =====================
# MCP (desactivado)
# =====================
# El servidor MCP "dbhub" apuntaba a MySQL, que ya no existe. ControlBot ahora consulta
# MongoDB con sus propias herramientas (DatabaseTools), así que MCP queda apagado.
spring.ai.mcp.client.enabled=${MCP_ENABLED:false}
spring.ai.mcp.client.type=ASYNC
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
spring.ai.mcp.client.stdio.timeout=60s

# =====================
# SPRING SECURITY
# =====================
spring.security.user.name=admin
spring.security.user.password=admin

# =====================
# THYMELEAF
# =====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# =====================
# MULTIPART
# =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# =====================
# JWT (app movil Flutter)
# =====================
# Clave para firmar los tokens (minimo 32 caracteres). Cambiala si despliegas el sistema.
app.jwt.secret=${JWT_SECRET:AsistControl-clave-de-desarrollo-cambiar-2026!}
app.jwt.expiracion-horas=8
# Escuchar en todas las interfaces para que el celular (misma WiFi) llegue al backend
server.address=0.0.0.0
# Puerto: Render/Railway lo asignan con la variable PORT
server.port=${PORT:8080}
# Origenes permitidos (CORS) para la app Flutter web. En la nube: CORS_ORIGINS=https://tu-app.vercel.app
app.cors.origenes=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# Geolocalizacion: distancia maxima (metros) entre el estudiante y el salon
app.geo.radio-metros=${GEO_RADIO_METROS:100}
# Servicio de IA en Python (FastAPI + Random Forest). En la nube: IA_URL=https://...onrender.com
app.ia.url=${IA_URL:http://localhost:8000}
app.ia.api-key=${IA_API_KEY:clave-ia-desarrollo}
